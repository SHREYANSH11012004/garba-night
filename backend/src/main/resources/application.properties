spring.application.name=garba-partner
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.email-verification.otp-ttl-seconds=${EMAIL_VERIFICATION_OTP_TTL_SECONDS:600}
app.email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.email-verification.verified-ttl-seconds=${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:900}
app.email-verification.from=${MAIL_FROM:${MAIL_USERNAME:}}
